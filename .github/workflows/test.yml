name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai_service/requirements.txt
      # CPU-only PyTorch keeps the free runner's download small.
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests

  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Rebuilds the model tables from the committed result files and fails if they differ.
      - run: ./reproduce.sh tables
      # Rebuilds the revised paper's numbers and tables and fails if they differ.
      - run: ./reproduce.sh paper

  end-to-end:
    needs: [backend, ai-service]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai_service/requirements.txt
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r ai_service/requirements.txt
      - name: Start the vision service and wait until it answers
        run: |
          (cd ai_service && uvicorn main:app --host 127.0.0.1 --port 8000 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 2; done
          echo "vision service did not start" && exit 1
      - run: npm ci && AI_SERVICE_E2E_URL=http://127.0.0.1:8000 node --test --test-name-pattern="end to end" tests/ai.test.js
        working-directory: backend
