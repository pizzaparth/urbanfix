<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Technology stack used in the project">
  <title>Technology Stack</title>

  <defs>
    <style>
      .band  { font-size: 12px; font-weight: 700; letter-spacing: 2px; fill: #8A7794; }
      .name  { font-size: 15px; font-weight: 700; fill: #1B1020; }
      .role  { font-size: 12px; fill: #6B5B75; }
      .tile  { fill: #FFFFFF; stroke: #E4DCEA; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#FFFFFF"/>

  <!-- ═══════════ CLIENT ═══════════ -->
  <rect x="40" y="60" width="1120" height="180" rx="20" fill="#FAF6FE" stroke="#EDE4F6"/>
  <text x="64" y="46" class="band">CLIENT — EXPO REACT NATIVE (iOS · ANDROID · WEB)</text>

  <!-- React -->
  <g>
    <rect x="66" y="86" width="168" height="128" rx="14" class="tile"/>
    <g transform="translate(150,126)">
      <circle r="6" fill="#61DAFB"/>
      <ellipse rx="26" ry="10" fill="none" stroke="#61DAFB" stroke-width="2.6"/>
      <ellipse rx="26" ry="10" fill="none" stroke="#61DAFB" stroke-width="2.6" transform="rotate(60)"/>
      <ellipse rx="26" ry="10" fill="none" stroke="#61DAFB" stroke-width="2.6" transform="rotate(120)"/>
    </g>
    <text x="150" y="176" class="name" text-anchor="middle">React Native 0.86</text>
    <text x="150" y="196" class="role" text-anchor="middle">React 19.2 · New Arch</text>
  </g>

  <!-- Expo -->
  <g>
    <rect x="250" y="86" width="168" height="128" rx="14" class="tile"/>
    <g transform="translate(334,126)">
      <path d="M-26 10 C -14 -12, 14 -12, 26 10" fill="none" stroke="#000000" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M-16 14 C -8 -2, 8 -2, 16 14" fill="none" stroke="#000000" stroke-width="3.4" stroke-linecap="round"/>
    </g>
    <text x="334" y="176" class="name" text-anchor="middle">Expo SDK 57</text>
    <text x="334" y="196" class="role" text-anchor="middle">Expo Go · EAS-ready</text>
  </g>

  <!-- React Navigation -->
  <g>
    <rect x="434" y="86" width="168" height="128" rx="14" class="tile"/>
    <g transform="translate(518,126)" fill="none" stroke="#7C3AED" stroke-width="2.8" stroke-linecap="round">
      <rect x="-26" y="-18" width="52" height="36" rx="8"/>
      <circle cx="-10" cy="0" r="5" fill="#7C3AED" stroke="none"/>
      <line x1="2" y1="-6" x2="18" y2="-6"/>
      <line x1="2" y1="6" x2="18" y2="6"/>
    </g>
    <text x="518" y="176" class="name" text-anchor="middle">React Navigation 7</text>
    <text x="518" y="196" class="role" text-anchor="middle">Tabs · native stack</text>
  </g>

  <!-- Reanimated -->
  <g>
    <rect x="618" y="86" width="168" height="128" rx="14" class="tile"/>
    <g transform="translate(702,126)">
      <path d="M-26 8 C -14 -20, 0 20, 12 -8 L 26 -8" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
      <circle cx="26" cy="-8" r="4.5" fill="#DC2626"/>
    </g>
    <text x="702" y="176" class="name" text-anchor="middle">Reanimated 4</text>
    <text x="702" y="196" class="role" text-anchor="middle">UI-thread worklets</text>
  </g>

  <!-- Skia-free graphics: SVG -->
  <g>
    <rect x="802" y="86" width="168" height="128" rx="14" class="tile"/>
    <g transform="translate(886,126)" fill="none" stroke="#7C3AED" stroke-width="2.8">
      <circle cx="0" cy="0" r="20" stroke-dasharray="94 32" transform="rotate(-90)"/>
      <circle cx="0" cy="0" r="8" stroke="#DC2626"/>
    </g>
    <text x="886" y="176" class="name" text-anchor="middle">react-native-svg</text>
    <text x="886" y="196" class="role" text-anchor="middle">Icons · ring chart</text>
  </g>

  <!-- FlashList / Blur -->
  <g>
    <rect x="986" y="86" width="148" height="128" rx="14" class="tile"/>
    <g transform="translate(1060,122)" fill="none" stroke="#7C3AED" stroke-width="2.6" stroke-linecap="round">
      <rect x="-24" y="-16" width="48" height="10" rx="4"/>
      <rect x="-24" y="-1" width="48" height="10" rx="4"/>
      <rect x="-24" y="14" width="48" height="10" rx="4" stroke="#DC2626"/>
    </g>
    <text x="1060" y="176" class="name" text-anchor="middle">FlashList</text>
    <text x="1060" y="196" class="role" text-anchor="middle">+ expo-blur</text>
  </g>

  <!-- ═══════════ SERVER ═══════════ -->
  <rect x="40" y="280" width="1120" height="180" rx="20" fill="#FDF4F5" stroke="#F7DFE2"/>
  <text x="64" y="266" class="band">SERVER — NODE.JS REST API</text>

  <!-- Node -->
  <g>
    <rect x="66" y="306" width="168" height="128" rx="14" class="tile"/>
    <g transform="translate(150,346)">
      <path d="M0 -24 L 21 -12 L 21 12 L 0 24 L -21 12 L -21 -12 Z" fill="none" stroke="#539E43" stroke-width="3"/>
      <path d="M-7 8 L -7 -7 L 7 12 L 7 -8" fill="none" stroke="#539E43" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="150" y="396" class="name" text-anchor="middle">Node.js</text>
    <text x="150" y="416" class="role" text-anchor="middle">Runtime</text>
  </g>

  <!-- Express -->
  <g>
    <rect x="250" y="306" width="168" height="128" rx="14" class="tile"/>
    <text x="334" y="358" text-anchor="middle" font-size="34" font-weight="800" fill="#1B1020">ex</text>
    <text x="334" y="396" class="name" text-anchor="middle">Express 4</text>
    <text x="334" y="416" class="role" text-anchor="middle">Routing · middleware</text>
  </g>

  <!-- JWT -->
  <g>
    <rect x="434" y="306" width="168" height="128" rx="14" class="tile"/>
    <g transform="translate(518,346)" fill="none" stroke="#DC2626" stroke-width="2.8" stroke-linecap="round">
      <rect x="-16" y="-4" width="32" height="24" rx="5"/>
      <path d="M-9 -4 v-8 a9 9 0 0 1 18 0 v8"/>
      <circle cx="0" cy="8" r="3" fill="#DC2626" stroke="none"/>
    </g>
    <text x="518" y="396" class="name" text-anchor="middle">JWT + bcrypt</text>
    <text x="518" y="416" class="role" text-anchor="middle">Auth · hashing</text>
  </g>

  <!-- Zod -->
  <g>
    <rect x="618" y="306" width="168" height="128" rx="14" class="tile"/>
    <g transform="translate(702,346)">
      <path d="M-22 -14 H 22 L -22 14 H 22" fill="none" stroke="#7C3AED" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <text x="702" y="396" class="name" text-anchor="middle">Zod</text>
    <text x="702" y="416" class="role" text-anchor="middle">Schema validation</text>
  </g>

  <!-- Nodemailer -->
  <g>
    <rect x="802" y="306" width="168" height="128" rx="14" class="tile"/>
    <g transform="translate(886,346)" fill="none" stroke="#DC2626" stroke-width="2.8" stroke-linejoin="round">
      <rect x="-24" y="-15" width="48" height="30" rx="5"/>
      <path d="M-24 -13 L 0 5 L 24 -13"/>
    </g>
    <text x="886" y="396" class="name" text-anchor="middle">Nodemailer</text>
    <text x="886" y="416" class="role" text-anchor="middle">OTP · receipts</text>
  </g>

  <!-- PDFKit / Multer -->
  <g>
    <rect x="986" y="306" width="148" height="128" rx="14" class="tile"/>
    <g transform="translate(1060,344)" fill="none" stroke="#7C3AED" stroke-width="2.8" stroke-linejoin="round">
      <path d="M-15 -18 H 7 L 16 -9 V 18 H -15 Z"/>
      <path d="M7 -18 V -9 H 16"/>
    </g>
    <text x="1060" y="396" class="name" text-anchor="middle">PDFKit</text>
    <text x="1060" y="416" class="role" text-anchor="middle">+ Multer uploads</text>
  </g>

  <!-- ═══════════ DATA ═══════════ -->
  <rect x="40" y="500" width="1120" height="164" rx="20" fill="#FAF6FE" stroke="#EDE4F6"/>
  <text x="64" y="486" class="band">DATA &amp; TOOLING</text>

  <!-- MongoDB -->
  <g>
    <rect x="66" y="524" width="200" height="116" rx="14" class="tile"/>
    <g transform="translate(150,560)">
      <path d="M0 -22 C 12 -8, 12 10, 0 22 C -12 10, -12 -8, 0 -22 Z" fill="none" stroke="#47A248" stroke-width="3"/>
      <line x1="0" y1="-22" x2="0" y2="26" stroke="#47A248" stroke-width="2.4"/>
    </g>
    <text x="166" y="614" class="name" text-anchor="middle">MongoDB + Mongoose</text>
  </g>

  <!-- Metro -->
  <g>
    <rect x="286" y="524" width="200" height="116" rx="14" class="tile"/>
    <g transform="translate(386,560)" fill="none" stroke="#DC2626" stroke-width="2.8" stroke-linecap="round">
      <circle cx="0" cy="0" r="20"/>
      <path d="M-20 0 H 20 M 0 -20 V 20"/>
    </g>
    <text x="386" y="614" class="name" text-anchor="middle">Metro bundler</text>
  </g>

  <!-- Fonts -->
  <g>
    <rect x="506" y="524" width="200" height="116" rx="14" class="tile"/>
    <text x="606" y="572" text-anchor="middle" font-size="32" font-weight="800" fill="#7C3AED">Aa</text>
    <text x="606" y="614" class="name" text-anchor="middle">Space Grotesk · Jakarta</text>
  </g>

  <!-- Axios -->
  <g>
    <rect x="726" y="524" width="200" height="116" rx="14" class="tile"/>
    <g transform="translate(826,560)" fill="none" stroke="#7C3AED" stroke-width="2.8" stroke-linecap="round">
      <path d="M-20 6 H 20"/><path d="M12 -2 L 20 6 L 12 14"/>
      <path d="M20 -10 H -20" stroke="#DC2626"/><path d="M-12 -18 L -20 -10 L -12 -2" stroke="#DC2626"/>
    </g>
    <text x="826" y="614" class="name" text-anchor="middle">Axios REST client</text>
  </g>

  <!-- Git -->
  <g>
    <rect x="946" y="524" width="188" height="116" rx="14" class="tile"/>
    <g transform="translate(1040,560)" fill="none" stroke="#DC2626" stroke-width="2.8">
      <circle cx="-14" cy="10" r="5"/><circle cx="14" cy="10" r="5"/><circle cx="0" cy="-14" r="5"/>
      <path d="M0 -9 V 4 M -9 10 H 9" stroke-linecap="round"/>
    </g>
    <text x="1040" y="614" class="name" text-anchor="middle">Git</text>
  </g>
</svg>
