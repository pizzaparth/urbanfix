   </g>
   <g id="text_25">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Arial'; text-anchor: start; fill: #1b1b1b" x="50.619267" y="87.905586" transform="rotate(-0 50.619267 87.905586)">Learn</text>
   </g>
   <g id="text_26">
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #1b1b1b" transform="translate(34.059267 102.617202)">Approved researchers query anonymised</text>
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #1b1b1b" transform="translate(34.059267 110.625024)">data; admins track performance.</text>
   </g>
