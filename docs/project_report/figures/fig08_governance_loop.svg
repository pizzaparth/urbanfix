   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Arial'; text-anchor: start; fill: #1b1b1b" x="184.68" y="36.605586" transform="rotate(-0 184.68 36.605586)">Report</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #1b1b1b" transform="translate(168.12 51.394897)">Citizen files photos, location and ward;</text>
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #1b1b1b" transform="translate(168.12 59.512915)">verifies with an email OTP, no account.</text>
   </g>
   <g id="text_7">
    <text style="font-style: italic; font-size: 6.3px; font-family: 'Arial'; text-anchor: start; fill: #7f7f7f" x="168.12" y="73.8196" transform="rotate(-0 168.12 73.8196)">Expo app, /api/complaints</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial'; text-anchor: middle; fill: #ffffff" x="307.940733" y="87.620918" transform="rotate(-0 307.940733 87.620918)">2</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Arial'; text-anchor: start; fill: #1b1b1b" x="318.740733" y="87.905586" transform="rotate(-0 318.740733 87.905586)">Validate</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #1b1b1b" transform="translate(302.180733 102.658843)">Category YOLOv8 model boxes or masks</text>
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #1b1b1b" transform="translate(302.180733 110.586938)">the defect; unsure cases go to review.</text>
   </g>
   <g id="text_11">
    <text style="font-style: italic; font-size: 6.3px; font-family: 'Arial'; text-anchor: start; fill: #7f7f7f" x="302.180733" y="125.1196" transform="rotate(-0 302.180733 125.1196)">FastAPI AI service</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial'; text-anchor: middle; fill: #ffffff" x="307.940733" y="190.220918" transform="rotate(-0 307.940733 190.220918)">3</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Arial'; text-anchor: start; fill: #1b1b1b" x="318.740733" y="190.505586" transform="rotate(-0 318.740733 190.505586)">Prioritise</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #1b1b1b" transform="translate(302.180733 205.217202)">Weighted questionnaire and AI damage</text>
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #1b1b1b" transform="translate(302.180733 213.147329)">estimate set the urgency level.</text>
   </g>
   <g id="text_15">
    <text style="font-style: italic; font-size: 6.3px; font-family: 'Arial'; text-anchor: start; fill: #7f7f7f" x="302.180733" y="227.71031" transform="rotate(-0 302.180733 227.71031)">urgency.js, aiAnalysis</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial'; text-anchor: middle; fill: #ffffff" x="173.88" y="241.520918" transform="rotate(-0 173.88 241.520918)">4</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Arial'; text-anchor: start; fill: #1b1b1b" x="184.68" y="241.805586" transform="rotate(-0 184.68 241.805586)">Act</text>
   </g>
   <g id="text_18">
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #1b1b1b" transform="translate(168.12 256.556812)">Supervisor triages and assigns in ward;</text>
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #1b1b1b" transform="translate(168.12 264.525024)">field worker repairs and uploads proof.</text>
   </g>
   <g id="text_19">
    <text style="font-style: italic; font-size: 6.3px; font-family: 'Arial'; text-anchor: start; fill: #7f7f7f" x="168.12" y="279.0196" transform="rotate(-0 168.12 279.0196)">workflow engine</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Arial'; text-anchor: middle; fill: #ffffff" x="39.819267" y="190.220918" transform="rotate(-0 39.819267 190.220918)">5</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'Arial'; text-anchor: start; fill: #1b1b1b" x="50.619267" y="190.505586" transform="rotate(-0 50.619267 190.505586)">Prove</text>
   </g>
   <g id="text_22">
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #1b1b1b" transform="translate(34.059267 205.294897)">Closure emails a PDF receipt; the full</text>
    <text style="font-size: 6.5px; font-family: 'Arial'; fill: #1b1b1b" transform="translate(34.059267 213.147329)">history stays public in the registry.</text>
   </g>
   <g id="text_23">
    <text style="font-style: italic; font-size: 6.3px; font-family: 'Arial'; text-anchor: start; fill: #7f7f7f" x="34.059267" y="227.7196" transform="rotate(-0 34.059267 227.7196)">PDFKit, /api/public</text>
   </g>
   <g id="text_24">
