<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-label="Mockup of the public registry search, filter, and complaint list">
  <defs>
    <clipPath id="winClip2">
      <rect x="0" y="0" width="960" height="580" rx="14" ry="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#winClip2)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="960" height="580" fill="#0A0A0A" />

    <!-- Title bar -->
    <rect x="0" y="0" width="960" height="44" fill="#111111" />
    <line x1="0" y1="44" x2="960" y2="44" stroke="#1F1F1F" stroke-width="1" />
    <circle cx="28" cy="22" r="6" fill="#FF5F57" />
    <circle cx="50" cy="22" r="6" fill="#FFBD2E" />
    <circle cx="72" cy="22" r="6" fill="#28C840" />
    <rect x="360" y="11" width="240" height="22" rx="6" fill="#1A1A1A" stroke="#272727" />
    <text x="480" y="26" font-size="11" fill="#6E6E6E" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">urbanfix.gov/registry</text>

    <!-- Page heading -->
    <text x="40" y="98" font-size="28" font-weight="700" fill="#FAFAFA">Public Complaints Registry</text>
    <text x="40" y="124" font-size="13" fill="#ADADAD">Browse all publicly filed issues — citizen contact details are always redacted.</text>

    <!-- Filter card -->
    <rect x="40" y="150" width="880" height="112" rx="10" fill="#111111" stroke="#1F1F1F" stroke-width="1" />
    <text x="64" y="180" font-size="14" font-weight="600" fill="#FAFAFA">Search &amp; Filter Registry</text>

    <text x="64" y="203" font-size="11" fill="#6E6E6E">WARD / AREA LOCATION</text>
    <rect x="64" y="211" width="248" height="34" rx="6" fill="#0A0A0A" stroke="#FAFAFA" stroke-width="1.5" />
    <text x="80" y="233" font-size="12" fill="#6E6E6E">Ward, area, or landmark</text>

    <text x="336" y="203" font-size="11" fill="#6E6E6E">CATEGORY</text>
    <rect x="336" y="211" width="248" height="34" rx="6" fill="none" stroke="#272727" />
    <text x="352" y="233" font-size="12" fill="#ADADAD">All Categories</text>

    <text x="608" y="203" font-size="11" fill="#6E6E6E">STATUS</text>
    <rect x="608" y="211" width="248" height="34" rx="6" fill="none" stroke="#272727" />
    <text x="624" y="233" font-size="12" fill="#ADADAD">All Statuses</text>

    <!-- Result rows -->
    <rect x="40" y="282" width="880" height="88" rx="10" fill="#111111" stroke="#272727" />
    <rect x="64" y="300" width="86" height="20" rx="4" fill="none" stroke="#272727" />
    <text x="107" y="314" font-size="10" fill="#ADADAD" text-anchor="middle">POTHOLE</text>
    <text x="164" y="315" font-size="12" fill="#6E6E6E">Ward 4, Main Market Road</text>
    <text x="64" y="342" font-size="15" font-weight="600" fill="#FAFAFA">Deep pothole damaging vehicles near bus stop</text>
    <rect x="748" y="298" width="108" height="22" rx="5" fill="none" stroke="#3B82F6" />
    <text x="802" y="313" font-size="10" font-weight="600" fill="#3B82F6" text-anchor="middle">IN PROGRESS</text>

    <rect x="40" y="382" width="880" height="88" rx="10" fill="#111111" stroke="#272727" />
    <rect x="64" y="400" width="86" height="20" rx="4" fill="none" stroke="#272727" />
    <text x="107" y="414" font-size="10" fill="#ADADAD" text-anchor="middle">GARBAGE</text>
    <text x="164" y="415" font-size="12" fill="#6E6E6E">Ward 7, Old Bus Stand Road</text>
    <text x="64" y="442" font-size="15" font-weight="600" fill="#FAFAFA">Garbage overflowing onto the main road</text>
    <rect x="768" y="398" width="88" height="22" rx="5" fill="none" stroke="#22C55E" />
    <text x="812" y="413" font-size="10" font-weight="600" fill="#22C55E" text-anchor="middle">RESOLVED</text>

    <rect x="40" y="482" width="880" height="62" rx="10" fill="#111111" stroke="#272727" opacity="0.6" />
    <text x="64" y="518" font-size="13" fill="#6E6E6E">3 more public records…</text>

    <!-- Cursor, over the location search field -->
    <g transform="translate(150, 214)">
      <path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"
            transform="scale(1.7)" fill="#FAFAFA" stroke="#0A0A0A" stroke-width="1.1" stroke-linejoin="round" />
    </g>
  </g>
</svg>
